<!doctype html>
<meta charset="utf-8">
<title>Clay attached transaction certificate spike</title>
<script type="module">
const workerUrl = new URL("./worker.ts", import.meta.url);
window.certRun = payload => new Promise((resolve, reject) => {
  const worker = new Worker(workerUrl, { type: "module" });
  const timer = setTimeout(() => { worker.terminate(); reject(new Error(`worker timeout: ${payload.op}`)); }, 30000);
  const finish = value => { clearTimeout(timer); worker.terminate(); resolve(value); };
  worker.onerror = event => { clearTimeout(timer); worker.terminate(); reject(new Error(event.message)); };
  worker.onmessage = event => {
    const message = event.data;
    if (message.type === "ready") worker.postMessage(payload);
    else if (message.type === "reached") finish({ kind: "terminated", point: message.point });
    else if (message.type === "result") finish({ kind: "result", value: message.value });
    else if (message.type === "error") { clearTimeout(timer); worker.terminate(); reject(new Error(message.error)); }
  };
});
</script>
