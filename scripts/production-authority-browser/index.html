<!doctype html>
<meta charset="utf-8">
<title>Clay production authority browser evidence</title>
<script type="module">
const testedSourceTree = __CLAY_TESTED_SOURCE_TREE__;
document.documentElement.dataset.claySourceTree = testedSourceTree;
const workerUrl = new URL("./worker.ts", import.meta.url);
window.authorityRun = payload => new Promise((resolve, reject) => {
  const worker = new Worker(workerUrl, { type: "module" });
  const timer = setTimeout(() => {
    worker.terminate();
    reject(new Error(`authority worker timeout: ${payload.op}`));
  }, 60000);
  const finish = value => { clearTimeout(timer); worker.terminate(); resolve(value); };
  worker.onerror = event => {
    clearTimeout(timer); worker.terminate(); reject(new Error(event.message));
  };
  worker.onmessage = event => {
    const message = event.data;
    if (message.type === "ready") worker.postMessage(payload);
    else if (message.type === "result") finish(message.value);
    else if (message.type === "error") {
      clearTimeout(timer); worker.terminate(); reject(new Error(message.error));
    }
  };
});
</script>
